services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobscout
      POSTGRES_USER: jobscout
      POSTGRES_PASSWORD: jobscout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: jobscout
      DATABASE_USER: jobscout
      DATABASE_PASSWORD: jobscout
    depends_on:
      - db
    volumes:
      - ./backend/src:/app/src

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  pgdata:
